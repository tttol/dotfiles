# Use Ctrl-b as the prefix; number windows and panes from 1.
set -g default-terminal 'tmux-256color'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -s escape-time 10

# Keep the server alive when WezTerm disconnects.
set -g destroy-unattached off

# Create windows and splits in the current pane's working directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'

# The status line also drives continuum's periodic saves; leave it enabled.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour250'
setw -g window-status-current-style 'bg=colour75,fg=colour235,bold'

# Ctrl-b Ctrl-s saves; Ctrl-b Ctrl-r restores the latest snapshot.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

# Install TPM before starting tmux, then press Ctrl-b Shift-i for plugins.
# Keep plugin initialization last so continuum can update status-right.
if-shell 'test -f "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell ~/.tmux/plugins/tpm/tpm'
